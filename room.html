<!DOCTYPE html>
<meta charset="UTF-8">
<html>
<head>
    <title>Group Video Chat</title>
    <style>
        html {
            background-color: #222;
        }
        #video-container {
            display: flex;
            flex-wrap: wrap;
            flex-direction: row;
            
            justify-content: center;
            align-content: center;
            
            width: 100vw;
            height: 100vh;
            background-color: #000;
            margin: 0;
            overflow: hidden;
        }

        .video-player {
            margin: 0;
            padding: 0;
            box-sizing: border-box; 
            position: relative;
            background-color: #1a1a1a;
            border: 1px solid #333;
        }   
        #action-menu {
            position: fixed;
            bottom: 20px; 
            left: 50%;
            transform: translateX(-50%);
            
            /* Your existing styles */
            background: #383838;
            width: 400px;
            height: 50px;
            display: flex;
            border-radius: 8px; 
            z-index: 1000;
        }
        #soundList {
            position: fixed;
            bottom: 80px; 
            left: 50%;
            transform: translateX(-50%);
            margin-left: -60px;
            justify-content: center;

            background: #383838;
            width: 250px;
            height: 50px;
            display: flex;
            border-radius: 8px; 
            z-index: 1000;
            display: none;
            flex-direction: row;
            gap: 10px
        }
        #soundList p {
            cursor: pointer;
        }
        .button {
            background-color: gray;
            height: 40px;
            width: 50px;
            border-radius: 8px;
            margin-left: 5px;
            margin-top: 5px;
            cursor: pointer;
        }
        #screen-player {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: calc(100vh - 70px);
            background-color: #000;
            z-index: 500;
            border: none;
        }

        #pip-strip {
            display: none;
            position: fixed;
            bottom: 80px; /* sits just above the action bar */
            right: 10px;
            z-index: 600;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        #pip-strip .video-player {
            width: 160px;
            height: 90px;
            border-radius: 6px;
            border: 1px solid #555;
            overflow: hidden;
            background: #1a1a1a;
        }
        .name-tag {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 20px;
            pointer-events: none;
            z-index: 10;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <!-- <div id="screen-player" class="video-player" style="display: none;"></div> -->
         <div id="local-player" class="video-player"></div>
    </div>
    <div id="pip-strip"></div>
    
    <div id="action-menu">
        <button id="mic-btn" class="button"><img src='icons/micro.png' height="30" width="30"></button>
        <button id="video-btn" class="button"><img src='icons/cam-on.png' height="30" width="30"></button>
        <button id="sound-bar" class="button"><img src='icons/smile.png' height="30" width="30"></button>
        <button id="screen-share-btn" class="button"><img src='icons/screen-share.png' height="30" width="30"></button>
    </div>
    <div id="soundList">
        <p onclick="playSound('sfx/train.mp3')">🚆</p>
        <p onclick="playSound('sfx/poop.mp3')">💩</p>
        <p onclick="playSound('sfx/meow.mp3')">🐱</p>
        <p onclick="playSound('sfx/explosion.mp3')">💥</p>
        <p onclick="playSound('sfx/correct.mp3')">✅</p>
        <p onclick="playSound('sfx/wrong.mp3')">❌</p>
        <p onclick="playSound('sfx/hamburger.mp3')">🍔</p>
        <p onclick="playSound('sfx/door.mp3')">🚪</p>
    </div>


</body>
<script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</html>
