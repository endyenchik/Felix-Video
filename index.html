<!DOCTYPE html>
<html>
<head>
    <title>FelixVideo</title>
    <style>
        /* 1. Center everything on the page using the Body */
        body {
            background-color: #222;
            font-family: Sans-serif;
            margin: 0;
            height: 100vh; /* Full screen height */
            display: flex;
            flex-direction: column;
            justify-content: center; /* Vertical center */
            align-items: center;     /* Horizontal center */
            color: snow;
        }
        
        /* 2. Group the title and phrase */
        #title {
            text-align: center;
            margin-bottom: 20px; /* Space between text and menu */
        }
        
        #title h1 {
            font-size: 60px;
            margin: 0;
        }
        
        #title p {
            font-size: 14px;
            margin-top: 5px;
        }

        /* 3. The Menu box */
        #menu {
            background: #383838;
            width: 300px; 
            padding: 20px;
            display: flex;
            flex-direction: column; 
            gap: 15px; 
            border-radius: 8px; 
        }

        #menu input {
            height: 40px;
            border-radius: 4px;
            border: none;
            padding: 5px;
            box-sizing: border-box;
        }

        #proceedButton {
            background-color: cornflowerblue;
            color: snow;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id = "title">
        <h1>Felix Video</h1>
        <p id="greeting">the most simple video chatting website there is</p>
    </div>
    
    <div id="menu">
        <h2>Enter the room ID:</h2>
        <input type="text" id="roomSelector" placeholder="Enter the id">
        <input type="submit" id="proceedButton" value="Join Call" onclick="proceed()">
    </div>
</body>
<script>
    let phrases = [
        "ready to talk?",

        "plese enjoy your time here",
        '"test_text"',
        "also play Zoom",
        "no animals were hurt while creating this",
        "functionality > design",
        "yes",
        "hope you have succsesful chat",
        "AI is good only when it helps you, rather than replacing you",
        "Fiat Multipla was actually good all this time",
        "swearing won't make you look cooler",
        "unix for my life",
        "this function was inspired by Minecraft",
        "Teto word of the day! Chatting!",
        "If the whole world chooses to stand against me, I will fight like I always had!",

        "I learned that drinking too much soda is bad for you in the worst way possible...",
        "Guys, hear me out...",
        "Follow the train, CJ",

        "If your name is Jane, than you are way too early...",

    let random    
    function randomPhrase () {
        let past_phrase = localStorage.getItem('past_phrase')
        random = phrases[Math.floor(Math.random() * phrases.length)]
        if (random === past_phrase) {
            randomPhrase()
        }
        else {
            localStorage.setItem('past_phrase',random)
            document.getElementById("greeting").textContent = random
        }
    }
    randomPhrase()
    function proceed() {
        let id = document.getElementById("roomSelector").value
        console.log(id)
        localStorage.setItem('id',id)

        window.location.href = "room.html"
    }
</script>

</html>
